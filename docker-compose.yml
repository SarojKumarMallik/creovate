services:

  frontend:
    build:
      context: ./frontend
    container_name: creovate_frontend
    ports:
      - "8086:80"
    restart: unless-stopped

  admin:
    build:
      context: ./AdminPannel
    container_name: creovate_admin
    ports:
      - "8087:80"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: creovate_backend
    ports:
      - "5005:5005"
    env_file:
      - .env
    restart: unless-stopped